<!DOCTYPE html>
<html>
<head>
    <title>求人一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>📋 求人一覧</h1>
    <a href="/applicants" class="btn btn-secondary mt-2 mb-2">応募者一覧を見る</a>
    <table class="table table-striped table-hover table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>職種</th>
                <th>会社名</th>
                <th>勤務地</th>
                <th>雇用形態</th>
                <th>掲載日</th>
            </tr>
        </thead>
        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job.id }}</td>
                <td>{{ job.title }}</td>
                <td>{{ job.company }}</td>
                <td>{{ job.location }}</td>
                <td>{{ job.employment_type }}</td>
                <td>{{ job.posted_date }}</td>
                <td class="text-center">
                    <a href="/apply" class="btn btn-success">この職種に応募する</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
