<!DOCTYPE html>
<html>
<head>
    <title>応募フォーム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>📝 応募フォーム</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">名前</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">メールアドレス</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
            <label for="job_id" class="form-label">応募職種</label>
            <select class="form-select" name="job_id" required>
                {% for job in jobs %}
                <option value="{{ job.id }}">{{ job.title }}（{{ job.company }}）</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">志望動機</label>
            <textarea class="form-control" name="message" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">応募する</button>
    </form>
</body>
</html>
